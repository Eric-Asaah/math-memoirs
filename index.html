<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathematical Memoirs — Eric Asaah</title>
    <meta name="description" content="A working notebook of mathematical discoveries, mistakes, and open questions." />
    <meta property="og:title" content="Mathematical Memoirs — Eric Asaah" />
    <meta property="og:description" content="A working notebook of mathematical discoveries, mistakes, and open questions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mathematical Memoirs — Eric Asaah" />
    <meta name="twitter:description" content="A working notebook of mathematical discoveries, mistakes, and open questions." />
    <link rel="canonical" href="https://eric-asaah.github.io/math-memoirs/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0e0c;
            color: #ede8dc;
            font-family: 'IM Fell English', Georgia, serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* subtle gold pattern overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 39px,
                    rgba(201, 168, 76, 0.015) 39px,
                    rgba(201, 168, 76, 0.015) 40px),
                repeating-linear-gradient(90deg,
                    transparent,
                    transparent 39px,
                    rgba(201, 168, 76, 0.01) 39px,
                    rgba(201, 168, 76, 0.01) 40px);
            pointer-events: none;
            z-index: 0;
        }

        .cover {
            position: relative;
            z-index: 1;
            max-width: 680px;
            width: 100%;
            text-align: center;
            padding: 40px 24px;
            border: 1px solid rgba(210, 170, 100, 0.12);
            background: rgba(15, 14, 12, 0.6);
            backdrop-filter: blur(2px);
            animation: fadeIn 1s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .portrait {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 24px;
            border: 1px solid rgba(210, 170, 100, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1714;
        }

        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .portrait-placeholder {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            color: #4a453c;
            text-align: center;
            padding: 8px;
            line-height: 1.4;
        }

        .author-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: #c9a84c;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 4.8rem);
            font-weight: 900;
            color: #e8d09a;
            letter-spacing: -0.01em;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        h1 em {
            font-style: italic;
            color: #c9a84c;
        }

        .subtitle {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #9a9080;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .subtitle-2 {
            font-family: 'IM Fell English', serif;
            font-size: 0.9rem;
            color: #7a6e5a;
            margin-bottom: 32px;
            letter-spacing: 0.04em;
        }

        .divider-line {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px auto 28px;
            max-width: 320px;
        }

        .divider-line::before,
        .divider-line::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(210, 170, 100, 0.25), transparent);
        }

        .divider-line span {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: #7a5e28;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .btn-nav {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            color: #ede8dc;
            background: rgba(201, 168, 76, 0.08);
            border: 1px solid rgba(210, 170, 100, 0.2);
            padding: 12px 28px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-nav::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(201, 168, 76, 0.06);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .btn-nav:hover {
            border-color: #c9a84c;
            color: #e8d09a;
        }

        .btn-nav:hover::after {
            transform: scaleX(1);
        }

        .btn-nav span {
            position: relative;
            z-index: 1;
        }

        .btn-nav--primary {
            background: rgba(201, 168, 76, 0.15);
            border-color: rgba(210, 170, 100, 0.35);
            font-size: 13px;
            padding: 16px 40px;
            letter-spacing: 0.3em;
        }

        .btn-nav--primary:hover {
            background: rgba(201, 168, 76, 0.25);
        }

        .btn-nav--secondary {
            font-size: 10px;
            padding: 10px 20px;
            letter-spacing: 0.15em;
            opacity: 0.7;
        }

        .btn-nav--secondary:hover {
            opacity: 1;
        }

        .footer-links {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #4a4030;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        .footer-links a:hover {
            color: #8a7a5a;
            border-bottom-color: rgba(201, 168, 76, 0.2);
        }

        @media (max-width: 500px) {
            .cover {
                padding: 24px 16px;
            }
            .btn-nav {
                padding: 10px 20px;
                font-size: 10px;
            }
            .btn-nav--primary {
                padding: 14px 28px;
                font-size: 12px;
            }
            .footer-links {
                gap: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .cover { animation: none; }
            .btn-nav::after { transition: none; }
            .btn-nav:hover::after { transform: scaleX(0); }
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="portrait">
            <img src="assets/headshot.png" alt="Eric Asaah" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
            <span class="portrait-placeholder" style="display:none;">Eric Asaah</span>
        </div>

        <p class="author-name">Eric Asaah</p>

        <h1>Mathematical<br /><em>Memoirs</em></h1>

        <p class="subtitle">A Working Notebook</p>
        <p class="subtitle-2">Exploratory mathematics, one discovery at a time.</p>

        <div class="divider-line">
            <span>❧</span>
        </div>

        <div class="nav-buttons">
            <a href="entries.html" class="btn-nav btn-nav--primary"><span>Read the Notebook</span></a>
            <a href="about.html" class="btn-nav btn-nav--secondary"><span>About</span></a>
            <a href="https://github.com/Eric-Asaah/math-memoirs/issues/new?labels=feedback&title=Mathematical%20Memoirs%20feedback" class="btn-nav btn-nav--secondary"><span>Feedback</span></a>
        </div>

        <div class="footer-links">
            <a href="https://github.com/Eric-Asaah/math-memoirs">GitHub</a>
            <a href="https://www.youtube.com/@Emaphy">YouTube</a>
        </div>
    </div>
</body>
</html>
