    <!-- Enhanced particle system with parallax -->
    <script>
        (function() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let mouseX = 0;
            let mouseY = 0;
            let targetMouseX = 0;
            let targetMouseY = 0;
            const PARTICLE_COUNT = 65;
            const MAX_SPEED = 0.35;
            const PARALLAX_STRENGTH = 0.12;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.reset();
                    this.baseX = this.x;
                    this.baseY = this.y;
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.baseX = this.x;
                    this.baseY = this.y;
                    this.size = Math.random() * 4.5 + 2.5;
                    this.speedX = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.speedY = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.opacity = Math.random() * 0.4 + 0.25;
                    this.hue = 40 + Math.random() * 15;
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.01 + Math.random() * 0.02;
                    this.parallaxFactor = 0.3 + Math.random() * 0.7;
                }

                update(parallaxX, parallaxY) {
                    const offsetX = parallaxX * this.parallaxFactor;
                    const offsetY = parallaxY * this.parallaxFactor;
                    const targetX = this.baseX + offsetX;
                    const targetY = this.baseY + offsetY;

                    this.x += (targetX - this.x) * 0.02;
                    this.y += (targetY - this.y) * 0.02;
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.pulse += this.pulseSpeed;

                    this.speedX += (Math.random() - 0.5) * 0.008;
                    this.speedY += (Math.random() - 0.5) * 0.008;

                    const maxSpd = MAX_SPEED;
                    const spd = Math.sqrt(this.speedX * this.speedX + this.speedY * this.speedY);
                    if (spd > maxSpd) {
                        this.speedX = (this.speedX / spd) * maxSpd;
                        this.speedY = (this.speedY / spd) * maxSpd;
                    }

                    const padding = 50;
                    if (this.x < -padding || this.x > width + padding) {
                        this.speedX *= -1;
                        this.x = Math.max(-padding, Math.min(width + padding, this.x));
                    }
                    if (this.y < -padding || this.y > height + padding) {
                        this.speedY *= -1;
                        this.y = Math.max(-padding, Math.min(height + padding, this.y));
                    }
                }

                draw() {
                    const pulseFactor = 0.6 + 0.4 * Math.sin(this.pulse);
                    const currentSize = this.size * (0.7 + 0.3 * pulseFactor);
                    const currentOpacity = this.opacity * (0.6 + 0.4 * pulseFactor);

                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, currentSize * 3
                    );
                    gradient.addColorStop(0, `rgba(${this.hue + 15}, ${this.hue + 100}, 40, ${currentOpacity})`);
                    gradient.addColorStop(0.3, `rgba(${this.hue + 10}, ${this.hue + 80}, 30, ${currentOpacity * 0.6})`);
                    gradient.addColorStop(1, `rgba(${this.hue}, ${this.hue + 60}, 20, 0)`);

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentSize * 3, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentSize * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 235, 180, ${currentOpacity * 0.8})`;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, currentSize * 0.2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 250, 230, ${currentOpacity * 0.9})`;
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push(new Particle());
                }
            }

            function updateMousePosition(clientX, clientY) {
                targetMouseX = (clientX / width) * 2 - 1;
                targetMouseY = (clientY / height) * 2 - 1;
            }

            document.addEventListener('mousemove', (e) => {
                updateMousePosition(e.clientX, e.clientY);
            });

            document.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                if (touch) {
                    updateMousePosition(touch.clientX, touch.clientY);
                }
            }, { passive: true });

            document.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                if (touch) {
                    updateMousePosition(touch.clientX, touch.clientY);
                }
            }, { passive: true });

            document.addEventListener('mouseleave', () => {
                targetMouseX = 0;
                targetMouseY = 0;
            });

            function animate() {
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                const parallaxX = mouseX * PARALLAX_STRENGTH * width * 0.5;
                const parallaxY = mouseY * PARALLAX_STRENGTH * height * 0.5;

                ctx.clearRect(0, 0, width, height);

                for (const p of particles) {
                    p.update(parallaxX, parallaxY);
                    p.draw();
                }

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 200) {
                            const alpha = (1 - dist / 200) * 0.12;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(201, 168, 76, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', () => {
                resize();
                initParticles();
            });

            resize();
            initParticles();
            animate();
        })();
    </script>

    <!-- app.js handles dynamic content loading -->
    <script src="app.js" defer></script>
</body>
</html>
