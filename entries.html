<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mathematical Memoirs — Notebook</title>
    <meta name="description" content="A public online mathematics notebook: discoveries, mistakes, and open questions." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eric-asaah.github.io/math-memoirs/entries.html" />
    <meta property="og:title" content="Mathematical Memoirs — Notebook" />
    <meta property="og:description" content="A public online mathematics notebook: discoveries, mistakes, and open questions." />
    <meta property="og:image" content="https://eric-asaah.github.io/math-memoirs/assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mathematical Memoirs — Notebook" />
    <meta name="twitter:description" content="A public online mathematics notebook: discoveries, mistakes, and open questions." />
    <meta name="twitter:image" content="https://eric-asaah.github.io/math-memoirs/assets/og-image.png" />
    <link rel="canonical" href="https://eric-asaah.github.io/math-memoirs/entries.html" />
    <link rel="icon" type="image/png" href="assets/favicon.png" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#d9cdb0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@300;400&family=Shadows+Into+Light&display=swap" rel="stylesheet" />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #d9cdb0;
            --surface: #fef7e8;
            --card: #fcf3e0;
            --card-pending: #f8efda;
            --border: rgba(140, 90, 40, 0.2);
            --border-hi: rgba(140, 90, 40, 0.4);
            --gold: #b58a4a;
            --gold-pale: #d4b87a;
            --gold-dim: #8a6a3a;
            --ink: #2c2418;
            --ink-muted: #5a4e3a;
            --ink-faint: #8a7a62;
            --ink-placeholder: #9a8a72;
            --red-mark: #8b3a3a;
            --verified: #2e5c3e;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 25% 40%, rgba(160, 120, 60, 0.08) 2%, transparent 2.5%),
                radial-gradient(circle at 70% 85%, rgba(100, 70, 30, 0.06) 1.8%, transparent 2.2%);
            background-size: 52px 52px, 38px 38px;
            color: var(--ink);
            font-family: 'IM Fell English', Georgia, serif;
            line-height: 1.75;
            min-height: 100vh;
            padding: 48px 24px;
            position: relative;
        }

        /* worn edge overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    rgba(140, 90, 40, 0.03) 0px,
                    rgba(140, 90, 40, 0.03) 2px,
                    transparent 2px,
                    transparent 8px);
            z-index: 2;
        }

        /* faint ink scratch marks */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" opacity="0.08"><path d="M40 50 L70 45 M110 30 L130 40 M250 80 L290 70 M340 120 L370 135 M20 200 L55 190 M180 250 L220 240 M310 220 L340 235 M380 270 L395 280" stroke="%237a4c2a" stroke-width="1.8" fill="none"/><path d="M150 50 Q170 70 165 100 M280 180 Q300 200 310 230" stroke="%238b5a2e" stroke-width="1.2" fill="none"/></svg>');
            background-repeat: repeat;
            background-size: 240px 180px;
            z-index: 2;
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 3;
            max-width: 860px;
            margin: 0 auto;
        }

        .back-to-cover {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--gold-dim);
            border: 1px solid #e0ca94;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(220, 190, 110, 0.08);
            transition: background 0.2s, color 0.2s;
            margin-bottom: 24px;
        }

        .back-to-cover:hover {
            background: rgba(180, 140, 60, 0.15);
            color: var(--gold);
        }

        .notebook-header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-width: 1px 2px 2px 1px;
            border-radius: 4px 16px 4px 16px;
            padding: 40px 48px 32px;
            margin-bottom: 40px;
            box-shadow: 8px 10px 16px rgba(0, 0, 0, 0.04);
        }

        .notebook-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #3a2a1c;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }

        .notebook-header .subhead {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 1.05rem;
            color: var(--ink-muted);
        }

        .notebook-header .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 16px 0 8px;
        }

        .notebook-header .divider::before,
        .notebook-header .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .notebook-header .divider span {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--gold-dim);
        }

        .search-wrap {
            margin-bottom: 28px;
        }

        .search-wrap label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold-dim);
            display: block;
            margin-bottom: 6px;
        }

        .search-wrap input {
            width: 100%;
            font-family: 'IM Fell English', serif;
            font-size: 1rem;
            padding: 10px 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink);
            border-radius: 4px;
        }

        .search-wrap input::placeholder {
            color: var(--ink-faint);
        }

        .search-wrap input:focus {
            outline: 2px solid var(--gold-dim);
            outline-offset: 2px;
        }

        .entry-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-width: 1px 2px 2px 1px;
            border-radius: 4px 12px 4px 12px;
            padding: 32px 36px 28px;
            margin-bottom: 24px;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.02);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .entry-card:hover {
            border-color: var(--border-hi);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.02);
        }

        .entry-stamp {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 0 8px 0 4px;
            background: var(--verified);
            color: #ffffff;
            margin-bottom: 8px;
        }

        .entry-stamp.pending {
            background: var(--red-mark);
        }

        .entry-header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .entry-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--gold-dim);
            letter-spacing: 0.1em;
        }

        .entry-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--ink-faint);
            letter-spacing: 0.05em;
            margin-left: auto;
        }

        h2.entry-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #3a2a1c;
            margin-bottom: 8px;
            line-height: 1.25;
        }

        .entry-body {
            font-family: 'IM Fell English', serif;
            font-size: 0.95rem;
            color: var(--ink-muted);
            line-height: 1.75;
            margin-bottom: 16px;
        }

        .entry-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .tag {
            border: 1px solid var(--border);
            color: var(--ink-faint);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.08em;
            padding: 2px 10px;
            border-radius: 4px;
        }

        .entry-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 14px;
            border-top: 1px solid rgba(140, 90, 40, 0.08);
        }

        .entry-toolbar-left {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .entry-toolbar-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .like-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.06em;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--ink-muted);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: border-color 0.2s, color 0.2s;
        }

        .like-btn:hover {
            border-color: var(--gold-dim);
            color: var(--gold-dim);
        }

        .like-btn[aria-pressed="true"] {
            border-color: var(--gold-dim);
            color: var(--gold);
        }

        .btn-ghost {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--ink-faint);
            border-bottom: 1px solid transparent;
            padding: 4px 0;
            transition: color 0.2s, border-color 0.2s;
        }

        .btn-ghost:hover {
            color: var(--gold);
            border-bottom-color: var(--gold-dim);
        }

        .note-on-entry {
            margin-left: 12px;
            padding-left: 12px;
            border-left: 1px solid rgba(140, 90, 40, 0.15);
        }

        .entry-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--gold);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid var(--gold-dim);
            padding: 8px 20px;
            border-radius: 4px;
            transition: all 0.25s;
        }

        .entry-cta:hover {
            background: var(--gold);
            color: var(--bg);
            border-color: var(--gold);
        }

        .entry-cta::after {
            content: '→';
            transition: transform 0.2s;
        }

        .entry-cta:hover::after {
            transform: translateX(4px);
        }

        .entry-card.pending {
            background: var(--card-pending);
            border-style: dashed;
        }

        .entry-card.pending .entry-body {
            color: #8a8580;
        }

        .entry-card.pending .entry-title {
            color: var(--ink-muted);
        }

        .entry-card.pending .tag {
            color: #8a8580;
            border-color: rgba(140, 90, 40, 0.12);
        }

        .entry-card.pending .entry-cta {
            opacity: 0.5;
            pointer-events: none;
            border-color: var(--ink-faint);
            color: var(--ink-faint);
        }

        .entry-card.pending .entry-cta::after {
            content: none;
        }

        .placeholder-card {
            border: 1px dashed var(--ink-faint);
            padding: 40px;
            text-align: center;
            color: var(--ink-placeholder);
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 0.95rem;
            border-radius: 4px;
        }

        .placeholder-card .placeholder-symbol {
            display: block;
            font-size: 2rem;
            margin-bottom: 12px;
            opacity: 0.45;
            font-family: 'Playfair Display', serif;
            color: var(--ink-placeholder);
        }

        .entries-loading {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-faint);
            padding: 24px 0;
        }

        .load-error {
            font-family: 'IM Fell English', Georgia, serif;
            font-size: 0.95rem;
            color: #6a3a3a;
            background: rgba(139, 58, 58, 0.08);
            border: 1px solid rgba(139, 58, 58, 0.25);
            padding: 18px 20px;
            border-radius: 4px;
            line-height: 1.65;
        }

        .connect-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-width: 1px 2px 2px 1px;
            border-radius: 4px 12px 4px 12px;
            padding: 28px 32px 30px;
            margin-top: 48px;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.04);
        }

        .connect-panel[hidden] {
            display: none !important;
        }

        .connect-heading {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #3a2a1c;
            margin-bottom: 8px;
        }

        .connect-intro {
            font-size: 0.95rem;
            color: var(--ink-muted);
            margin-bottom: 16px;
        }

        .social-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            color: var(--gold);
            background: rgba(180, 140, 60, 0.06);
            text-decoration: none;
            border-radius: 4px;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .social-link:hover {
            border-color: var(--gold-dim);
            color: var(--gold-dim);
            background: rgba(180, 140, 60, 0.12);
        }

        .social-link svg {
            display: block;
        }

        .btn-secondary {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid var(--gold-dim);
            color: var(--gold-dim);
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--gold-dim);
            color: var(--bg);
        }

        footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--ink-faint);
        }

        footer a {
            color: var(--gold-dim);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }

        footer a:hover {
            color: var(--gold);
            border-bottom-color: var(--gold-dim);
        }

        .footer-right {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--ink-faint);
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 16px;
            }
            .notebook-header {
                padding: 24px 20px;
            }
            .notebook-header h1 {
                font-size: 1.8rem;
            }
            .entry-card {
                padding: 24px 20px;
            }
            .connect-panel {
                padding: 20px;
            }
            footer {
                flex-direction: column;
            }
            .entry-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .entry-toolbar-left {
                justify-content: center;
            }
            .entry-toolbar-right {
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition: none !important;
            }
        }
    </style>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div class="wrapper">

        <!-- Back to Cover — uses navigation.backToCover from site.json -->
        <a href="index.html" class="back-to-cover" id="back-to-cover">← Back to Cover</a>

        <!-- Notebook Header — dynamically filled by app.js -->
        <div class="notebook-header">
            <h1 id="notebook-title">Mathematical Memoirs</h1>
            <p class="subhead" id="notebook-subhead">A Working Notebook — entries in progress and completed</p>
            <div class="divider"><span>❧</span></div>
        </div>

        <!-- Search — dynamically filled by app.js -->
        <div class="search-wrap">
            <label for="manuscript-search" id="search-label">Search entries</label>
            <input type="search" id="manuscript-search" name="q" placeholder="Title, tag, keyword, or entry number…" autocomplete="off" spellcheck="false" />
        </div>

        <!-- Entries Root — rendered by app.js -->
        <div id="entries-root">
            <p id="entries-loading" class="entries-loading">Loading entries…</p>
        </div>

        <!-- Connect Panel — rendered by app.js -->
        <section id="connect-panel" class="connect-panel" hidden></section>

        <!-- Footer — dynamically filled by app.js -->
        <footer>
            <div class="footer-left">
                <strong id="footer-author">Eric Asaah</strong><br />
                Maintained © <span id="copyright-year"></span><br />
                <span id="footer-license">CC BY-NC-ND 4.0</span>
                <p id="footer-privacy" style="font-size:0.8rem;margin-top:6px;color:var(--ink-faint);" hidden></p>
            </div>
            <div class="footer-right" id="footer-tagline">Just a boy with Interest &amp; Curiosity</div>
        </footer>

    </div>

    <!-- app.js handles dynamic content loading -->
    <script src="app.js" defer></script>
</body>
</html>
